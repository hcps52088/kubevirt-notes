site_name: KubeVirt 學習筆記
site_description: 在 Kubernetes 上運行虛擬機 — 架構、安裝、VM 管理、Storage、Networking、Live Migration
site_author: hcps52088
site_url: https://hcps52088.github.io/kubevirt-notes/

repo_name: hcps52088/kubevirt-notes
repo_url: https://github.com/hcps52088/kubevirt-notes

theme:
  name: material
  language: zh-TW
  palette:
    scheme: slate
    primary: amber
    accent: orange
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: 本頁目錄
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首頁: index.md
  - 第一章 架構原理: 01-architecture/index.md
  - 第二章 安裝與設定: 02-installation/index.md
  - 第三章 虛擬機管理: 03-virtual-machines/index.md
  - 第四章 Storage: 04-storage/index.md
  - 第五章 Networking: 05-networking/index.md
  - 第六章 Live Migration: 06-live-migration/index.md
